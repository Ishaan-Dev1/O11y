# GKE overrides - merge on top of values.yaml
tempo:
  global:
    dnsService: "kube-dns"
  gateway:
    nginxConfig:
      resolver: "kube-dns.kube-system.svc.cluster.local."
  ingester:
    persistence:
      storageClass: standard-rwo
