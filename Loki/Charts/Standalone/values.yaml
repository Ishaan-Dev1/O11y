logging:
  global:
    dnsService: "coredns"
    # dnsService: "kube-dns"

  fullnameOverride: loki

  # Monolithic (deprecated: SingleBinary): Loki runs as a single binary that
  # serves every role (distributor, ingester, querier, compactor, ...).
  # Suitable for small installs (up to a few tens of GB/day) without HA.
  deploymentMode: Monolithic

  loki:
    image:
      registry: quay.io
      repository: opstree/loki
      tag: "3.6-debian13"
    schemaConfig:
      configs:
        - from: 2024-04-01
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    commonConfig:
      replication_factor: 1
    storage:
      type: s3
      bucketNames:
        chunks: o11y-logs
        ruler: o11y-logs
        admin: o11y-logs
      s3:
        endpoint: https://minio.ldc.opstree.dev:9000
        accessKeyId: minioadmin
        secretAccessKey: opstreeadmin@2510
        s3ForcePathStyle: true
        insecure: false
    compactor:
      compaction_interval: 10m
      delete_request_store: s3
      retention_delete_delay: 1h
      retention_delete_worker_count: 10
      retention_enabled: true
      working_directory: /var/loki/compactor
    ingester:
      chunk_encoding: snappy
      wal:
        enabled: true
        dir: /var/loki/wal
        flush_on_shutdown: true
      chunk_idle_period: 20m
      chunk_retain_period: 300s
      max_chunk_age: 10m
      flush_check_period: 30s
      chunk_target_size: 1536000
    limits_config:
      retention_period: 8h
      reject_old_samples: true
      reject_old_samples_max_age: 6h
      ingestion_rate_mb: 32
      ingestion_burst_size_mb: 32
      per_stream_rate_limit: 10MB
      per_stream_rate_limit_burst: 20MB
      split_queries_by_interval: 15m
      max_cache_freshness_per_query: 10m
      query_timeout: 300s
      volume_enabled: true
    tracing:
      enabled: false
    querier:
      # Default is 4, if you have enough memory and CPU you can increase, reduce if OOMing
      max_concurrent: 4
    query_stats_enabled: true
    # otlp_config:
    #   resource_attributes:
    #     attributes_config:
    #       - action: index_label
    #         attributes:
    #           - rems_service
    #           - rems_environment
    #           - rems_application_group
    #           - rems_category
    # pattern_ingester: controls the Loki pattern ingester component. Set enabled to true to enable pattern detection and extraction from logs.
    pattern_ingester:
      enabled: false
    auth_enabled: false
    structuredConfig:
      server:
        http_server_read_timeout: 600s
        http_server_write_timeout: 600s

  # ServiceMonitor for Prometheus Operator CRDs. VictoriaMetrics operator's
  # prometheus-converter converts these to VMServiceScrape so vmagent scrapes them.
  monitoring:
    serviceMonitor:
      enabled: true

  gateway:
    image:
      registry: docker.io
      repository: nginxinc/nginx-unprivileged
      tag: 1.27.3-alpine
    enabled: true
    replicas: 1
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
    resources: {}
      # requests:
      #   memory: 128Mi
      #   cpu: 100m
      # limits:
      #   memory: 256Mi
      #   cpu: 200m
    tolerations:
      - key: "team"
        operator: "Equal"
        value: "o11y"
        effect: "NoSchedule"
    # nodeSelector:
    #   cloud.google.com/gke-nodepool: obs-node-pool

    #-- nginx dns resolver need to update for GKE cluster
    #-- CoreDNS service name in GKE is kube-dns
    # nginxConfig:
    #   resolver: "kube-dns.kube-system.svc.cluster.local."

  # Single binary (monolithic) workload. Serves all Loki roles.
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 20Gi
      # storageClass: standard
      accessModes:
        - ReadWriteOnce
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2
        memory: 3Gi
    tolerations:
      - key: "team"
        operator: "Equal"
        value: "o11y"
        effect: "NoSchedule"
    # nodeSelector:
    #   cloud.google.com/gke-nodepool: obs-node-pool

  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

  # ignoreMinioDeprecation: The built-in MinIO subchart is deprecated and will be removed by 2026-10-31.
  # NOTE: External MinIO is used (minio.ldc.opstree.dev), so minio.enabled stays false.
  ignoreMinioDeprecation: true

  minio:
    enabled: false
    persistence:
      size: 15Gi

  # SimpleScalable targets must stay at 0 replicas in Monolithic mode.
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0

  # Disable loki Canary
  lokiCanary:
    enabled: false
  test:
    enabled: false

fluent-bit:
  fluent-bit:
    serviceMonitor:
      enabled: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          separator: ;
          regex: ^(.*)$
          targetLabel: node
          replacement: $1
          action: replace
        - sourceLabels: [__meta_kubernetes_pod_name]
          separator: ;
          regex: ^(.*)$
          targetLabel: pod
          replacement: $1
          action: replace
        - sourceLabels: [__meta_kubernetes_namespace]
          separator: ;
          regex: ^(.*)$
          targetLabel: namespace
          replacement: $1
          action: replace
    kind: DaemonSet
    podSecurityContext:
      runAsUser: 0
      runAsGroup: 0
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
      readOnlyRootFilesystem: false
      allowPrivilegeEscalation: false
    image:
      repository: quay.io/opstree/fluent-bit
      tag: 5.0.3
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
    tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "team"
        operator: "Equal"
        value: "o11y"
        effect: "NoSchedule"
    # nodeSelector:
    #   cloud.google.com/gke-nodepool: obs-node-pool
    config:
      service: |
        [SERVICE]
            Flush        1
            Daemon       Off
            Log_Level    info
            Parsers_File parsers.conf
            HTTP_Server  On
            HTTP_Listen  0.0.0.0
            HTTP_Port    2020

      inputs: |
        [INPUT]
            Name             tail
            Path             /var/log/containers/*.log
            Tag              kube.*
            Refresh_Interval 5
            Rotate_Wait      30
            Buffer_Max_Size  512k
            Mem_Buf_Limit    20MB
            Skip_Long_Lines  On
            DB               /var/log/flb_kube.db
            Ignore_Older     4h
            multiline.parser docker,cri

      filters: |
        [FILTER]
            Name                kubernetes
            Match               kube.*
            K8S-Logging.Parser  On
            K8S-Logging.Exclude Off
            Keep_Log            Off
            Merge_Log           On
            Buffer_Size         5MB
            Use_Kubelet         Off
            Kubelet_Port        10250
            Labels              On
            Annotations         On

        [FILTER]
            Name    grep
            Match   kube.*
            Exclude log (?i)DEBUG
            Exclude log /api/v1/readyz

        [FILTER]
            Name    lua
            Match   kube.*
            script  /fluent-bit/scripts/sampling.lua
            call    sample_info

      outputs: |
        [OUTPUT]
            Name              loki
            Match             *
            host              loki-gateway.logging.svc.cluster.local
            port              80
            drop_single_key   Off
            labels            namespace=$kubernetes['namespace_name'],pod=$kubernetes['pod_name'],container=$kubernetes['container_name'],service_name=$kubernetes['labels']['app'],name=$kubernetes['labels']['app.kubernetes.io/name'],application_group=$kubernetes['labels']['rems/application_group'],rems_service=$kubernetes['labels']['rems/service'],rems_environment=$kubernetes['labels']['rems/environment'],cluster=base-vcluster
            remove_keys       kubernetes

    luaScripts:
      sampling.lua: |
        math.randomseed(os.time())

        function sample_info(tag, timestamp, record)
          local msg = record["log"]
          if not msg then
            return 0, timestamp, record
          end
          -- Sample INFO logs (drop ~50%)
          if string.match(msg, "^INFO:") then
            if math.random() < 0.5 then
              return -1, timestamp, record
            end
          -- Sample DEBUG logs (drop ~95%)
          elseif string.match(msg, "^DEBUG:") then
            if math.random() < 0.95 then
              return -1, timestamp, record
            end
          end
          return 0, timestamp, record
        end
