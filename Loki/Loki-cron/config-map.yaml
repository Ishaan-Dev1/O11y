apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-backup-script
  namespace: logging
data:
  backup.sh: |
    #!/bin/sh
    set -e

    DATE=$(date +%Y-%m-%d_%H-%M-%S)
    BUCKET="${S3_BUCKET:-loki-backup}"

    echo "================================="
    echo "Starting Loki Backup"
    echo "Timestamp : $DATE"
    echo "================================="

    HAS_DATA=0

    for PATH_NAME in chunks index wal; do
      SRC="/var/loki/${PATH_NAME}"

      if [ ! -d "$SRC" ]; then
        echo "Skipping $PATH_NAME — directory not found"
        continue
      fi

      if [ -z "$(ls -A $SRC)" ]; then
        echo "Skipping $PATH_NAME — empty"
        continue
      fi

      echo "Syncing $PATH_NAME ..."
      aws s3 sync \
        "$SRC" \
        "s3://${BUCKET}/${PATH_NAME}/" \
        --endpoint-url="${MINIO_ENDPOINT_URL}"

      echo "✅ $PATH_NAME done"
      HAS_DATA=1
    done

    if [ "$HAS_DATA" = "0" ]; then
      echo "WARNING: Nothing to back up — all Loki paths were empty or missing."
      exit 0
    fi

    echo "Backup Completed Successfully at $DATE"
