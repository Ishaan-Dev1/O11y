apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vmagent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vmagent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.vmagent.replicaCount }}
  selector:
    matchLabels:
      {{- include "vmagent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vmagent.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.vmagent.serviceAccount.name }}
      containers:
        - name: vmagent
          image: "{{ .Values.vmagent.image.repository }}:{{ .Values.vmagent.image.tag }}"
          imagePullPolicy: {{ .Values.vmagent.image.pullPolicy }}
          args:
            - -promscrape.config=/config/scrape.yaml
            - -remoteWrite.url={{ .Values.vmagent.remoteWrite.url }}
            - -remoteWrite.tmpDataPath={{ .Values.vmagent.dataDir }}
            {{- if .Values.vmagent.remoteWrite.basicAuth }}
            - -remoteWrite.basicAuth.username={{ .Values.vmagent.remoteWrite.basicAuth.username }}
            - -remoteWrite.basicAuth.password={{ .Values.vmagent.remoteWrite.basicAuth.password }}
            {{- end }}
            {{- if .Values.vmagent.remoteWrite.bearerToken }}
            - -remoteWrite.bearerToken={{ .Values.vmagent.remoteWrite.bearerToken }}
            {{- end }}
            {{- range $k, $v := .Values.vmagent.extraArgs }}
            - -{{ $k }}={{ $v }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8429
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.vmagent.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: {{ .Values.vmagent.dataDir }}
      volumes:
        - name: config
          configMap:
            name: {{ include "vmagent.fullname" . }}-config
        - name: data
          emptyDir: {}
